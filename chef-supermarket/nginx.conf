events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Supermarket API stub
        location /api/v1/status {
            add_header Content-Type application/json;
            try_files /api/v1/status =404;
        }

        location /api/v1/universe {
            add_header Content-Type application/json;
            try_files /api/v1/universe =404;
        }

        # Cookbook downloads (file server)
        location /cookbooks/ {
            alias /usr/share/nginx/cookbooks/;
            autoindex on;
            autoindex_format json;
        }

        # Static UI
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
